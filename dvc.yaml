stages:
  acquire:
    cmd: python -m nsh_pipeline.acquire.download --params params.yaml --out-dir data/raw
    deps:
      - src/nsh_pipeline/acquire
      - src/nsh_pipeline/generate
    params:
      - seed
      - scale
      - reference_date
      - inject_issues
      - dataset
    outs:
      - data/raw

  preprocess:
    cmd: python -m nsh_pipeline.preprocess.run --raw-dir data/raw --out-dir data/processed --as-of ${reference_date}
    deps:
      - data/raw
      - src/nsh_pipeline/preprocess
    params:
      - reference_date
    outs:
      - data/processed

  # M3: raw + processed schemas, stats + drift vs reports/baseline, anomaly checks
  # (and reports/injection_detection.json). Same functions as the Airflow tasks
  # validate_raw, validate_processed, stats and anomalies.
  validate:
    cmd: python -m nsh_pipeline.validation.run --step all --raw-dir data/raw --processed-dir data/processed --params params.yaml
    deps:
      - data/raw
      - data/processed
      - reports/baseline
      - src/nsh_pipeline/validation
    params:
      - reference_date
      - scale
      - scales
      - validation
    outs:
      - reports/validation:
          cache: false
      - reports/stats:
          cache: false
      - reports/drift.json:
          cache: false
      - reports/anomalies.json:
          cache: false
      - reports/anomalies.md:
          cache: false
      - reports/injection_detection.json:
          cache: false

# Uncomment each stage once its module is merged (a missing dependency folder or a
# params section that doesn't exist yet makes `dvc repro` fail). Confirm the exact
# CLI and output paths with the owner; they must match orchestration/stages.py.

#  features:
#    cmd: python -m nsh_pipeline.features.run --processed-dir data/processed --out-dir data/features --params params.yaml
#    deps:
#      - data/processed
#      - src/nsh_pipeline/features
#    outs:
#      - data/features
#
  bias:
    cmd: python -m nsh_pipeline.bias.slicing --processed-dir data/processed --params params.yaml
    deps:
      - data/processed
      - src/nsh_pipeline/bias
    params:
      - bias
      - inject_issues      # the report checks the planted denial_skew when injection is on
      - reference_date
    outs:
      - data/bias          # swipe_weights.parquet (reweighing mitigation)
      - reports/bias_report.md:
          cache: false
      - reports/bias:
          cache: false


  # Phase 2 (Jairaghavendra): features + label + time-based split for model training.
  build_training_set:
    cmd: python -m nsh_pipeline.modeling.build --processed-dir data/processed --raw-dir data/raw --params params.yaml
    deps:
      - data/raw
      - data/processed
      - src/nsh_pipeline/modeling/dataset.py
      - src/nsh_pipeline/modeling/features.py
      - src/nsh_pipeline/modeling/split.py
      - src/nsh_pipeline/modeling/build.py
    params:
      - training_data
    outs:
      - data/training

  # Phase 2 (Kalpan): tune (Optuna + CV on train), refit, score on validation, select the best by
  # validation PR-AUC. Every run tracked in MLflow (experiment nsh-denial-model). See docs/model_training.md.
  train:
    cmd: python -m nsh_pipeline.modeling.train --data-dir data/training --params params.yaml
    deps:
      - data/training
      - src/nsh_pipeline/modeling/artifacts.py
      - src/nsh_pipeline/modeling/candidates.py
      - src/nsh_pipeline/modeling/charts.py
      - src/nsh_pipeline/modeling/select.py
      - src/nsh_pipeline/modeling/tracking.py
      - src/nsh_pipeline/modeling/train.py
      - src/nsh_pipeline/modeling/tune.py
    params:
      - seed
      - model
    outs:
      - models                      # candidates/<name>/ + best/ (model.joblib + metadata.json)
      - reports/model/training:     # candidates.json, comparison charts, tuning trials
          cache: false
