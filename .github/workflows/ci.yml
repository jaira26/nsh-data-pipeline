name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]  # lowest supported + newest the team uses
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Pinned versions from requirements.txt first, so CI tests what graders install.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]" ruff==0.17.2

      - name: Lint (PEP 8 via ruff)
        run: ruff check .

      # Tests need no network (download tests use file:// URLs) and no data/ folder.
      - name: Test
        run: pytest --cov=nsh_pipeline --cov-report=term-missing --cov-fail-under=80
