# Pipeline parameters, shared by the generator, preprocessing, Airflow and DVC.
seed: 42
scale: small                   # small | full
reference_date: "2025-06-15"   # "as of" date for generated data and preprocessing

scales:
  small:                       # fast: CI, tests, grading
    clients: 60
    max_members_per_client: 150
  full:                        # realistic size (~605 active clients in the real book)
    clients: 605
    max_members_per_client: 1000

# Known data problems for validation (M3) and bias analysis (M5) to detect.
# Off by default; set enabled: true to generate a dataset with them.
# Every injected record is listed in manifest.json under "injected_issues".
inject_issues:
  enabled: false
  duplicate_bill_lines: 5
  cents_as_dollars: 5
  orphan_swipes: 5
  unparseable_money: 5
  future_service_dates: 3
  status_casing_drift: 5
  denial_skew:
    state: "CA"
    rate: 0.30


# Where data acquisition downloads the raw dataset from (a GitHub Release asset).
# Leave url empty to generate the data locally from the seed instead.
dataset:
  url: "https://github.com/jaira26/nsh-data-pipeline/releases/download/data-v1.1/nsh-raw-small-v1.1.tar.gz"
  sha256: "dfe340b8773d57a76ba3d205ac60d3ba55af0464bc332bc5d0334391c9f106c0"

# Bias detection by data slicing (M5). Swipe outcomes (denial rate, substantiation rate) are
# compared across the client and member subgroups below. A slice is flagged when it is worse off
# than the overall rate by more than abs_diff_pts percentage points or rel_ratio times, has at
# least min_n rows (smaller slices are reported as "too small to judge"), and the gap is
# significant: one-sided Fisher exact test against all other rows, p < alpha / number of slices
# tested (Bonferroni, since dozens of slices are tested at once).
bias:
  min_n: 30
  abs_diff_pts: 10
  rel_ratio: 1.5
  alpha: 0.01
  slices:
    clients: [state, group_size_bucket, status]   # client_type is mostly null: not sliced
    members: [age_band, is_vip, coverage_tier, employee_status, gender]

# Validation, statistics, drift and anomaly checks (M3). See docs/validation.md.
validation:
  # strict: a schema failure or critical anomaly fails the stage (and the Airflow task).
  # report: write every report and alert, but never fail (injected-issue runs use this,
  # so bias slicing and DVC versioning still run).
  mode: strict
  sample_ids: 10                 # record ids listed per finding in the reports
  money_unit:
    # A value above this multiple of its column's median (positive values only) is a
    # money-unit error. Clean data peaks at 69.5x (a $5,000 swipe and its ledger line);
    # a cents-read-as-dollars value is ~100x its true size, so 100x separates the two.
    max_median_multiple: 100
    min_values: 20               # columns with fewer positive values are not checked
  active_clients:
    # Active, non-excluded clients as a share of the scale's client count. The generator
    # makes ~85% Active; outside this range the dataset is not the size we expect.
    min_share: 0.70
    max_share: 1.00
  stats:
    top_k: 5                     # most frequent values recorded per text column
    max_categories: 50           # text columns with more distinct values (ids, names) get no top-k
  drift:
    baseline_dir: reports/baseline   # committed clean-run stats; regenerated with --update-baseline
    # Thresholds sit well above seed-to-seed noise at small scale (seeds 1-5 vs 42):
    # money means move <= 5.5%, the swipe Denied share <= 0.54 pts. Same-seed reruns are
    # identical, so a row-count change is always real; 10% is where it starts to matter.
    row_count_pct: 10
    mean_pct: 20
    null_rate_pts: 1.0
    category_share_pts: 2.0
    headline:                    # the signal reported first in reports/drift.json
      table: swipes
      column: status
      value: Denied


# How likely a swipe is to be denied (generator, from data-v1.1).
# Effects add up on the log-odds scale; probability = 1 / (1 + exp(-total)).
# No effect for state, age, gender or VIP: the clean data is fair by design.
denial_model:
  intercept: -3.3
  log_amount: 0.6          # per unit of log(amount / $75): bigger charges, more denials
  category:                # Medical is the baseline (0)
    Dental: 0.9
    Vision: 0.7
    Drugs & Medicine: -0.2
  high_deductible: 0.5     # plan deductible >= $3,000
  new_member: 0.8          # less than 180 days since hire
  prior_denial: 0.7        # per denial in the previous 90 days (counted up to 3)
  manual_claim: 0.3        # not a debit-card swipe

# Model training set (phase 2): built from data/processed, split by service date.
training_data:
  validation_start: "2025-05-01"   # train = before this date
  test_start: "2025-06-01"         # validation = May; test = from this date
  out_dir: data/training

# Model training, tuning and selection (phase 2, Kalpan). See docs/model_training.md.
# Tuning: Optuna TPE, n_trials per model, stratified cv_folds-fold CV on the TRAIN split only.
# Selection: best validation PR-AUC (denials are a minority class) -> models/best/.
model:
  seed: 42
  candidates: [logistic_regression, random_forest, lightgbm]
  selection_metric: pr_auc
  cv_folds: 5
  n_trials: 25                     # CI and tests pass --n-trials 2
  models_dir: models
  reports_dir: reports/model/training
  mlflow:
    experiment: nsh-denial-model
    tracking_uri: "sqlite:///mlflow.db"   # MLFLOW_TRACKING_URI overrides (e.g. http://localhost:5000)
    log_models: true
  # Hyperparameter search space per model: {type: int|float|categorical, low, high, step, log, choices}
  search_space:
    logistic_regression:
      C: {type: float, low: 0.001, high: 100.0, log: true}         # inverse regularisation strength
      l1_ratio: {type: float, low: 0.0, high: 1.0}                   # 0 = ridge (L2), 1 = lasso (L1)
    random_forest:
      n_estimators: {type: int, low: 100, high: 500, step: 50}
      max_depth: {type: int, low: 3, high: 20}
      min_samples_leaf: {type: int, low: 1, high: 30}
      max_features: {type: categorical, choices: [sqrt, log2, 0.5]}
    lightgbm:
      n_estimators: {type: int, low: 100, high: 600, step: 50}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      num_leaves: {type: int, low: 8, high: 64}
      min_child_samples: {type: int, low: 5, high: 60}
      subsample: {type: float, low: 0.6, high: 1.0}
      colsample_bytree: {type: float, low: 0.6, high: 1.0}
      reg_lambda: {type: float, low: 0.001, high: 10.0, log: true}
