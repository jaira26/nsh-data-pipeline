      size: 190792
      nfiles: 26
    params:
      params.yaml:
        reference_date: '2025-06-15'
        scale: small
        scales:
          small:
            clients: 60
            max_members_per_client: 150
          full:
            clients: 605
            max_members_per_client: 1000
        validation:
          mode: strict
          sample_ids: 10
          money_unit:
            max_median_multiple: 100
            min_values: 20
          active_clients:
            min_share: 0.7
            max_share: 1.0
          stats:
            top_k: 5
            max_categories: 50
          drift:
            baseline_dir: reports/baseline
            row_count_pct: 10
            mean_pct: 20
            null_rate_pts: 1.0
            category_share_pts: 2.0
