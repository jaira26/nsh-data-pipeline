[project]
name = "nsh-pipeline"
version = "0.1.0"
description = "Data pipeline for synthetic NSH reporting data"
requires-python = ">=3.11"
dependencies = [
    "pandas", "numpy", "pyarrow", "pyyaml", "faker==40.43.0",
    "fairlearn==0.15.0", "matplotlib==3.11.2", "scipy==1.17.1",  # bias slicing (M5)
    "pandera[pandas]==0.34.1",  # schema validation (M3)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "dvc[gs]==3.67.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# PEP 8 checks for CI (`ruff check .`). W292 (newline at end of file) is off because
# most existing files were saved without one; it is cosmetic.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["W292"]
